version: "3.9"

# Production Setup - Uses Neon cloud database
# Usage: docker-compose -f docker-compose.prod.yml up -d

services:
  app:
    build:
      context: ..
      dockerfile: tuganire-docker/Dockerfile
    restart: always
    environment:
      DB_URL: jdbc:postgresql://ep-lively-sea-aj87r78n-pooler.c-3.us-east-2.aws.neon.tech/neondb?sslmode=require
      DB_USERNAME: neondb_owner
      DB_PASSWORD: npg_oQ8cFRbwjaq6
      JWT_SECRET: ${JWT_SECRET:-eyochatwithJ3v3w3s0cketz!@}
      JWT_EXPIRY_HOURS: 24
      HIBERNATE_HBM2DDL_AUTO: validate  # Use validate in production!
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - tuganire-network

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - tuganire-network

networks:
  tuganire-network:
    driver: bridge
